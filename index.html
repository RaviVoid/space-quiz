<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="우주 탐험 지식을 테스트해 보세요.">
  <title>우주 탐험 퀴즈</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #080b18;
      --card: rgba(18, 24, 52, .9);
      --card-soft: rgba(255, 255, 255, .06);
      --text: #f7f8ff;
      --muted: #aeb6d5;
      --line: rgba(255, 255, 255, .15);
      --accent: #8e7dff;
      --accent-2: #ed6bd1;
      --correct: #4fe19c;
      --wrong: #ff6e8a;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #eef1ff;
        --card: rgba(255, 255, 255, .88);
        --card-soft: rgba(71, 76, 145, .07);
        --text: #171a39;
        --muted: #626984;
        --line: rgba(52, 59, 112, .15);
      }
      body::before { opacity: .35; }
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px 56px;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }
    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 50% -10%, #624bb0 0, transparent 38%),
        radial-gradient(circle at 100% 80%, #df4fa3 0, transparent 26%);
      content: "";
      opacity: .6;
    }
    .shell { width: min(100%, 620px); margin: 0 auto; }
    header { margin: 0 0 24px; text-align: center; }
    .eyebrow {
      color: var(--correct);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1, h2, h3 { margin: 0; line-height: 1.1; }
    h1 { margin-top: 8px; font-size: clamp(2.4rem, 10vw, 4rem); letter-spacing: -.07em; }
    h1 span { color: var(--accent-2); }
    header p { max-width: 460px; margin: 13px auto 0; color: var(--muted); }
    .card {
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: clamp(22px, 5vw, 36px);
      background: var(--card);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .25), inset 0 1px rgba(255, 255, 255, .08);
      backdrop-filter: blur(16px);
    }
    .topline { display: flex; justify-content: space-between; align-items: start; gap: 16px; }
    .label { margin: 0 0 7px; color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h2 { font-size: 21px; }
    .score { min-width: 76px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 11px; text-align: right; }
    .score small { display: block; color: var(--muted); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
    .score strong { color: var(--accent-2); font-size: 22px; }
    .progress-wrap { margin: 25px 0 30px; }
    .progress-meta { display: flex; justify-content: space-between; margin-bottom: 8px; color: var(--muted); font-size: 12px; }
    .progress-track { height: 8px; overflow: hidden; border-radius: 99px; background: var(--card-soft); }
    .progress { width: 10%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .35s ease; }
    .category { margin: 0 0 9px; color: var(--accent-2); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h3 { margin-bottom: 22px; color: #ff4f6d; font-size: clamp(21px, 5vw, 28px); letter-spacing: -.035em; }
    .answers { display: grid; gap: 10px; }
    .answer, .button {
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    .answer { padding: 14px 16px; background: var(--card-soft); text-align: left; }
    .answer:hover:not(:disabled) { border-color: var(--accent); background: rgba(142, 125, 255, .16); transform: translateY(-2px); }
    .answer:disabled { cursor: default; }
    .answer.correct { border-color: var(--correct); background: rgba(79, 225, 156, .16); color: var(--correct); animation: correct-pop .38s ease; }
    .answer.wrong { border-color: var(--wrong); background: rgba(255, 110, 138, .15); color: var(--wrong); animation: wrong-shake .42s ease; }
    .feedback { min-height: 24px; margin: 17px 0 0; color: var(--muted); }
    .feedback.correct-text { color: var(--correct); }
    .feedback.wrong-text { color: var(--wrong); }
    .button { padding: 12px 17px; border: 0; background: linear-gradient(100deg, var(--accent), var(--accent-2)); color: white; font-weight: 700; box-shadow: 0 8px 22px rgba(142, 125, 255, .25); }
    .button:hover { transform: translateY(-2px); }
    .next { margin-top: 8px; }
    .results { text-align: center; }
    .reaction { display: grid; width: 76px; height: 76px; margin: 0 auto 18px; place-items: center; border-radius: 50%; background: rgba(237, 107, 209, .14); font-size: 42px; }
    .results h2 { font-size: 32px; }
    .results-copy { margin: 11px 0 20px; color: var(--muted); }
    .final-score { margin: 4px 0 25px; color: var(--muted); }
    .final-score strong { display: block; color: var(--accent-2); font-size: 58px; line-height: 1; }
    [hidden] { display: none !important; }
    @keyframes correct-pop { 0% { transform: scale(.98); } 55% { transform: scale(1.025); } 100% { transform: scale(1); } }
    @keyframes wrong-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-4px); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="eyebrow">✦ 미션 컨트롤 온라인</div>
      <h1>Cosmic <span>Explorer</span></h1>
      <p>열 가지 질문, 하나의 미션. 당신의 우주 지식은 어디까지 도달할까요?</p>
    </header>

    <section class="card" id="quiz" aria-live="polite">
      <div class="topline">
        <div><p class="label">현재 미션</p><h2 id="question-number">문제 1 / 10</h2></div>
        <div class="score"><small>점수</small><strong id="score">0</strong></div>
      </div>
      <div class="progress-wrap">
        <div class="progress-meta"><span>미션 진행률</span><span id="progress-percent">10%</span></div>
        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="10"><div class="progress" id="progress"></div></div>
      </div>
      <p class="category" id="category"></p>
      <h3 id="question"></h3>
      <div class="answers" id="answers"></div>
      <p class="feedback" id="feedback" role="status"></p>
      <button class="button next" id="next" type="button" hidden>다음 문제&nbsp; →</button>
    </section>

    <section class="card results" id="results" hidden>
      <div class="reaction" id="reaction" aria-hidden="true">🚀</div>
      <p class="label">미션 완료</p>
      <h2 id="result-title">멋진 비행이었어요!</h2>
      <p class="results-copy" id="result-copy"></p>
      <div class="final-score"><strong id="final-score">0</strong>점 획득</div>
      <button class="button" id="restart" type="button">다시 출발하기</button>
    </section>
  </main>

  <script>
    (() => {
      const questions = [
        ["태양계", "뚜렷한 고리로 유명한 행성은 무엇일까요?", ["화성", "토성", "해왕성", "금성"], "토성"],
        ["달", "지구에서 바라본 달의 위상이 변하는 이유는 무엇일까요?", ["지구의 그림자", "태양빛을 받는 달을 바라보는 각도가 변해서", "구름으로 가려져서", "달의 모양이 실제로 변해서"], "태양빛을 받는 달을 바라보는 각도가 변해서"],
        ["별", "태양과 대부분의 별을 빛나게 하는 과정은 무엇일까요?", ["연소", "핵융합", "지열", "빛의 반사"], "핵융합"],
        ["먼 우주", "우리 태양계가 속한 은하의 이름은 무엇일까요?", ["안드로메다 은하", "소용돌이 은하", "우리은하", "솜브레로 은하"], "우리은하"],
        ["우주 탐사", "성간 우주에 진입한 최초의 인공 물체는 무엇일까요?", ["보이저 1호", "아폴로 11호", "허블 우주망원경", "파이오니어 10호"], "보이저 1호"],
        ["우주론", "1광년은 무엇을 나타내는 단위일까요?", ["시간", "밝기", "거리", "속도"], "거리"],
        ["태양계", "공전 주기가 가장 짧은 행성은 무엇일까요?", ["지구", "수성", "화성", "목성"], "수성"],
        ["블랙홀", "사건의 지평선은 무엇일까요?", ["블랙홀의 밝은 고리", "빛조차 빠져나올 수 없는 경계", "블랙홀의 중심", "강력한 방사선 폭발"], "빛조차 빠져나올 수 없는 경계"],
        ["화성", "화성에서 가장 큰 화산의 이름은 무엇일까요?", ["올림푸스산", "마우나케아", "샤프산", "엘리시움 고지"], "올림푸스산"],
        ["우주 역사", "달을 처음으로 걸은 사람은 누구일까요?", ["버즈 올드린", "유리 가가린", "닐 암스트롱", "마이클 콜린스"], "닐 암스트롱"]
      ];
      let current = 0, score = 0, locked = false;
      const $ = id => document.getElementById(id);

      function render() {
        const [category, question, answers] = questions[current];
        locked = false;
        $("question-number").textContent = `문제 ${current + 1} / ${questions.length}`;
        $("score").textContent = score;
        $("progress-percent").textContent = `${Math.round(((current + 1) / questions.length) * 100)}%`;
        $("progress").style.width = `${((current + 1) / questions.length) * 100}%`;
        $("progress").parentElement.parentElement.setAttribute("aria-valuenow", Math.round(((current + 1) / questions.length) * 100));
        $("category").textContent = category;
        $("question").textContent = question;
        $("feedback").textContent = "";
        $("feedback").className = "feedback";
        $("next").hidden = true;
        $("answers").innerHTML = "";
        answers.forEach(answer => {
          const button = document.createElement("button");
          button.className = "answer";
          button.type = "button";
          button.textContent = answer;
          button.addEventListener("click", () => choose(button, answer));
          $("answers").appendChild(button);
        });
      }

      function choose(selected, answer) {
        if (locked) return;
        locked = true;
        const correct = questions[current][3];
        const isCorrect = answer === correct;
        document.querySelectorAll(".answer").forEach(button => {
          button.disabled = true;
          if (button.textContent === correct) button.classList.add("correct");
        });
        if (!isCorrect) selected.classList.add("wrong");
        if (isCorrect) {
          score += 100;
          $("score").textContent = score;
          $("feedback").textContent = "정답이에요! 멋진 궤도로 나아가고 있습니다.";
          $("feedback").className = "feedback correct-text";
        } else {
          $("feedback").textContent = `아쉬워요 — 정답은 ${correct}입니다.`;
          $("feedback").className = "feedback wrong-text";
        }
        $("next").hidden = false;
        $("next").textContent = current === questions.length - 1 ? "결과 보기  →" : "다음 문제  →";
      }

      function finish() {
        $("quiz").hidden = true;
        $("results").hidden = false;
        const ratio = score / (questions.length * 100);
        const outcome = ratio === 1 ? ["🏆", "완벽한 궤도예요!", "진정한 미션 커맨더처럼 모든 문제를 정확히 풀었습니다."] :
          ratio >= .7 ? ["🚀", "멋진 비행이었어요!", "당신의 우주 지식은 발사 준비가 끝났습니다."] :
          ratio >= .4 ? ["🌙", "좋은 비행이었어요!", "다음 미션을 위한 탄탄한 발판을 마련했습니다."] :
          ["🛰️", "미션 수락!", "모든 탐험은 하늘을 올려다보는 것에서 시작됩니다. 다시 도전해 보세요!"];
        $("reaction").textContent = outcome[0];
        $("result-title").textContent = outcome[1];
        $("result-copy").textContent = `${outcome[2]} ${questions.length}문제 중 ${score / 100}문제를 맞혔습니다.`;
        $("final-score").textContent = score;
      }

      $("next").addEventListener("click", () => current === questions.length - 1 ? finish() : (current++, render()));
      $("restart").addEventListener("click", () => { current = 0; score = 0; $("quiz").hidden = false; $("results").hidden = true; render(); });
      render();
    })();
  </script>
</body>
</html>
