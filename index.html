<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="우주 탐험 지식을 테스트해 보세요.">
  <title>우주 탐험 퀴즈</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --card: #fff;
      --card-soft: #f7f8fa;
      --text: #191f28;
      --muted: #6b7684;
      --line: #e5e8eb;
      --accent: #1b64da;
      --accent-soft: #edf5ff;
      --correct: #16835d;
      --correct-soft: #e8f7f0;
      --wrong: #b42318;
      --wrong-soft: #fff0f0;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 56px 20px 64px;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }
    body::before {
      position: fixed;
      inset: 0 0 auto;
      height: 280px;
      z-index: -1;
      background: linear-gradient(180deg, #eaf3ff 0, rgba(244, 246, 248, 0) 100%);
      content: "";
    }
    .shell { width: min(100%, 560px); margin: 0 auto; }
    header { margin: 0 0 28px; }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -.01em;
    }
    h1, h2, h3 { margin: 0; line-height: 1.35; }
    h1 { font-size: clamp(28px, 7vw, 36px); font-weight: 750; letter-spacing: -.045em; }
    h1 span { color: var(--accent); }
    header p { max-width: 460px; margin: 8px 0 0; color: var(--muted); }
    .card {
      border: 1px solid rgba(25, 31, 40, .04);
      border-radius: 24px;
      padding: clamp(22px, 6vw, 32px);
      background: var(--card);
      box-shadow: 0 8px 28px rgba(25, 31, 40, .06);
    }
    .topline { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .label { margin: 0 0 4px; color: var(--muted); font-size: 13px; font-weight: 600; }
    h2 { font-size: 20px; font-weight: 700; letter-spacing: -.025em; }
    .score { min-width: 82px; padding: 8px 12px; border-radius: 14px; background: var(--card-soft); text-align: right; }
    .score small { display: block; color: var(--muted); font-size: 12px; }
    .score strong { color: var(--accent); font-size: 22px; font-variant-numeric: tabular-nums; }
    .progress-wrap { margin: 26px 0 30px; }
    .progress-meta { display: flex; justify-content: space-between; margin-bottom: 10px; color: var(--muted); font-size: 13px; }
    .progress-track { height: 6px; overflow: hidden; border-radius: 99px; background: #edf0f2; }
    .progress { width: 10%; height: 100%; border-radius: inherit; background: var(--accent); transition: width .3s ease; }
    .category { margin: 0 0 8px; color: var(--accent); font-size: 13px; font-weight: 700; }
    h3 { margin-bottom: 22px; color: var(--text); font-size: clamp(20px, 5vw, 24px); font-weight: 700; letter-spacing: -.035em; }
    .answers { display: grid; gap: 10px; }
    .answer, .button {
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      transition: border-color .16s ease, background-color .16s ease, transform .16s ease;
    }
    .answer { width: 100%; min-height: 54px; padding: 14px 16px; background: var(--card); text-align: left; }
    .answer:hover:not(:disabled) { border-color: #9cc5ff; background: var(--accent-soft); }
    .answer:focus-visible, .button:focus-visible { outline: 3px solid rgba(49, 130, 246, .35); outline-offset: 3px; }
    .answer:disabled { cursor: default; }
    .answer.correct { border-color: #93d6b9; background: var(--correct-soft); color: var(--correct); animation: correct-pop .3s ease; }
    .answer.wrong { border-color: #f0aaaa; background: var(--wrong-soft); color: var(--wrong); animation: wrong-shake .35s ease; }
    .feedback { min-height: 24px; margin: 16px 0 0; color: var(--muted); font-size: 14px; }
    .feedback.correct-text { color: var(--correct); }
    .feedback.wrong-text { color: var(--wrong); }
    .button { min-height: 50px; padding: 12px 20px; border: 0; background: var(--accent); color: #fff; font-weight: 700; box-shadow: 0 4px 10px rgba(49, 130, 246, .18); }
    .button:hover { background: #1b64da; }
    .button:active { transform: scale(.98); }
    .next { margin-top: 10px; }
    .results { text-align: center; }
    .reaction { display: grid; width: 68px; height: 68px; margin: 0 auto 18px; place-items: center; border-radius: 22px; background: var(--accent-soft); font-size: 36px; }
    .results h2 { font-size: 28px; }
    .results .label { color: var(--accent); }
    .results-copy { margin: 10px 0 24px; color: var(--muted); }
    .final-score { margin: 0 0 18px; color: var(--muted); }
    .final-score strong { display: block; margin-bottom: 4px; color: var(--accent); font-size: 56px; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .best-score { margin: 0 0 26px; color: var(--muted); }
    .best-score strong { color: var(--text); font-variant-numeric: tabular-nums; }
    [hidden] { display: none !important; }
    @keyframes correct-pop { 0% { transform: scale(.98); } 55% { transform: scale(1.025); } 100% { transform: scale(1); } }
    @keyframes wrong-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-4px); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    @media (max-width: 420px) {
      body { padding: 32px 16px 40px; }
      .topline { align-items: flex-start; }
      .score { min-width: 72px; }
      .card { border-radius: 20px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="eyebrow">✦ 미션 컨트롤 온라인</div>
      <h1>우주 탐험 <span>퀴즈</span></h1>
      <p>열 가지 질문에 답하고, 우주 지식을 확인해 보세요.</p>
    </header>

    <section class="card" id="quiz" aria-live="polite">
      <div class="topline">
        <div><p class="label">현재 미션</p><h2 id="question-number">문제 1 / 10</h2></div>
        <div class="score"><small>점수</small><strong id="score">0</strong></div>
      </div>
      <div class="progress-wrap">
        <div class="progress-meta"><span>미션 진행률</span><span id="progress-percent">10%</span></div>
        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="10"><div class="progress" id="progress"></div></div>
      </div>
      <p class="category" id="category"></p>
      <h3 id="question"></h3>
      <div class="answers" id="answers"></div>
      <p class="feedback" id="feedback" role="status"></p>
      <button class="button next" id="next" type="button" hidden>다음 문제&nbsp; →</button>
    </section>

    <section class="card results" id="results" hidden>
      <div class="reaction" id="reaction" aria-hidden="true">🚀</div>
      <p class="label">미션 완료</p>
      <h2 id="result-title">멋진 비행이었어요!</h2>
      <p class="results-copy" id="result-copy"></p>
      <div class="final-score"><strong id="final-score">0</strong>점 획득</div>
      <p class="best-score">최고 점수: <strong id="best-score">0</strong>점</p>
      <button class="button" id="restart" type="button">다시 출발하기</button>
    </section>
  </main>

  <script>
    (() => {
      const questions = [
        ["태양계", "뚜렷한 고리로 유명한 행성은 무엇일까요?", ["화성", "토성", "해왕성", "금성"], "토성"],
        ["달", "지구에서 바라본 달의 위상이 변하는 이유는 무엇일까요?", ["지구의 그림자", "태양빛을 받는 달을 바라보는 각도가 변해서", "구름으로 가려져서", "달의 모양이 실제로 변해서"], "태양빛을 받는 달을 바라보는 각도가 변해서"],
        ["별", "태양과 대부분의 별을 빛나게 하는 과정은 무엇일까요?", ["연소", "핵융합", "지열", "빛의 반사"], "핵융합"],
        ["먼 우주", "우리 태양계가 속한 은하의 이름은 무엇일까요?", ["안드로메다 은하", "소용돌이 은하", "우리은하", "솜브레로 은하"], "우리은하"],
        ["우주 탐사", "성간 우주에 진입한 최초의 인공 물체는 무엇일까요?", ["보이저 1호", "아폴로 11호", "허블 우주망원경", "파이오니어 10호"], "보이저 1호"],
        ["우주론", "1광년은 무엇을 나타내는 단위일까요?", ["시간", "밝기", "거리", "속도"], "거리"],
        ["태양계", "공전 주기가 가장 짧은 행성은 무엇일까요?", ["지구", "수성", "화성", "목성"], "수성"],
        ["블랙홀", "사건의 지평선은 무엇일까요?", ["블랙홀의 밝은 고리", "빛조차 빠져나올 수 없는 경계", "블랙홀의 중심", "강력한 방사선 폭발"], "빛조차 빠져나올 수 없는 경계"],
        ["화성", "화성에서 가장 큰 화산의 이름은 무엇일까요?", ["올림푸스산", "마우나케아", "샤프산", "엘리시움 고지"], "올림푸스산"],
        ["우주 역사", "달을 처음으로 걸은 사람은 누구일까요?", ["버즈 올드린", "유리 가가린", "닐 암스트롱", "마이클 콜린스"], "닐 암스트롱"]
      ];
      let current = 0, score = 0, locked = false;
      const $ = id => document.getElementById(id);
      const highScoreKey = "spaceQuizHighScore";
      let bestScore = loadBestScore();

      function loadBestScore() {
        try {
          const storedScore = window.localStorage.getItem(highScoreKey);
          if (storedScore === null) return 0;
          const parsedScore = Number(storedScore);
          return Number.isInteger(parsedScore) && parsedScore >= 0 ? parsedScore : 0;
        } catch (error) {
          console.warn("최고 점수를 불러오지 못했습니다.", error);
          return 0;
        }
      }

      function render() {
        const [category, question, answers] = questions[current];
        locked = false;
        $("question-number").textContent = `문제 ${current + 1} / ${questions.length}`;
        $("score").textContent = score;
        $("progress-percent").textContent = `${Math.round(((current + 1) / questions.length) * 100)}%`;
        $("progress").style.width = `${((current + 1) / questions.length) * 100}%`;
        $("progress").parentElement.parentElement.setAttribute("aria-valuenow", Math.round(((current + 1) / questions.length) * 100));
        $("category").textContent = category;
        $("question").textContent = question;
        $("feedback").textContent = "";
        $("feedback").className = "feedback";
        $("next").hidden = true;
        $("answers").innerHTML = "";
        answers.forEach(answer => {
          const button = document.createElement("button");
          button.className = "answer";
          button.type = "button";
          button.textContent = answer;
          button.addEventListener("click", () => choose(button, answer));
          $("answers").appendChild(button);
        });
      }

      function choose(selected, answer) {
        if (locked) return;
        locked = true;
        const correct = questions[current][3];
        const isCorrect = answer === correct;
        document.querySelectorAll(".answer").forEach(button => {
          button.disabled = true;
          if (button.textContent === correct) button.classList.add("correct");
        });
        if (!isCorrect) selected.classList.add("wrong");
        if (isCorrect) {
          score += 100;
          $("score").textContent = score;
          $("feedback").textContent = "정답이에요! 멋진 궤도로 나아가고 있습니다.";
          $("feedback").className = "feedback correct-text";
        } else {
          $("feedback").textContent = `아쉬워요 — 정답은 ${correct}입니다.`;
          $("feedback").className = "feedback wrong-text";
        }
        $("next").hidden = false;
        $("next").textContent = current === questions.length - 1 ? "결과 보기  →" : "다음 문제  →";
      }

      function finish() {
        if (score > bestScore) {
          bestScore = score;
          try {
            window.localStorage.setItem(highScoreKey, String(bestScore));
          } catch (error) {
            console.warn("최고 점수를 저장하지 못했습니다.", error);
          }
        }
        $("quiz").hidden = true;
        $("results").hidden = false;
        const ratio = score / (questions.length * 100);
        const outcome = ratio === 1 ? ["🏆", "완벽한 궤도예요!", "진정한 미션 커맨더처럼 모든 문제를 정확히 풀었습니다."] :
          ratio >= .7 ? ["🚀", "멋진 비행이었어요!", "당신의 우주 지식은 발사 준비가 끝났습니다."] :
          ratio >= .4 ? ["🌙", "좋은 비행이었어요!", "다음 미션을 위한 탄탄한 발판을 마련했습니다."] :
          ["🛰️", "미션 수락!", "모든 탐험은 하늘을 올려다보는 것에서 시작됩니다. 다시 도전해 보세요!"];
        $("reaction").textContent = outcome[0];
        $("result-title").textContent = outcome[1];
        $("result-copy").textContent = `${outcome[2]} ${questions.length}문제 중 ${score / 100}문제를 맞혔습니다.`;
        $("final-score").textContent = score;
        $("best-score").textContent = bestScore;
      }

      $("next").addEventListener("click", () => current === questions.length - 1 ? finish() : (current++, render()));
      $("restart").addEventListener("click", () => { current = 0; score = 0; $("quiz").hidden = false; $("results").hidden = true; render(); });
      render();
    })();
  </script>
</body>
</html>
